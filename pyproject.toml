[project]
name = "croco-sign-backend"
version = "0.1.0"
description = "Backend that translates Polish Sign Language (PJM) video into spoken-language text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "deepl>=1.30.0",
    "fastapi>=0.136.3",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "transformers>=5.12.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/croco_sign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
