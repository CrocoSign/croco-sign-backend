[project]
name = "croco-sign-backend"
version = "0.1.0"
description = "Backend that translates Polish Sign Language (PJM) video into spoken-language text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arq>=0.26.0",
    "datasets>=5.0.0",
    "deepl>=1.30.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "huggingface-hub>=0.20.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/croco_sign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/croco_sign"]

[tool.coverage.report]
show_missing = true
