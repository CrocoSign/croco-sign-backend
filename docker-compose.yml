services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Settings are read from env with the CROCO_ prefix (see core/config.py).
      # Override here or via a .env file as needed, e.g.:
      # CROCO_CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      CROCO_REDIS_URL: redis://redis:6379/0
    env_file:
      # Optional: create a .env to inject secrets/overrides. Won't fail if absent.
      - path: .env
        required: false
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "croco_sign.worker.WorkerSettings"]
    environment:
      CROCO_REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
